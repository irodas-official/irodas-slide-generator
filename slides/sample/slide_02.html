<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, height=720">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
</style>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { sans: ['"Noto Sans JP"', 'sans-serif'] },
      colors: {
        primary: '#1B73E8', 'primary-dark': '#1557B0',
        secondary: '#34A853', accent: '#FF6D2E',
      }
    }
  }
}
</script>
</head>
<body class="font-sans">
<div class="w-[1280px] h-[720px] bg-white flex items-center relative overflow-hidden"
     data-speaker-notes="アジェンダの説明。今回は3つのセクションに分けて報告する。">
  <div class="w-2 h-full bg-primary absolute left-0 top-0"></div>
  <div class="absolute right-0 top-0 w-[400px] h-full bg-gradient-to-l from-primary/5 to-transparent"></div>
  <div class="pl-[100px] pr-[60px] z-10">
    <p class="text-primary text-[1rem] font-bold tracking-widest uppercase mb-4">AGENDA</p>
    <h2 class="text-[#1E293B] text-[2.5rem] font-bold leading-tight mb-8">本日のアジェンダ</h2>
    <div class="space-y-6">
      <div class="flex items-start gap-4">
        <span class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center text-white font-bold text-[1.125rem] shrink-0">1</span>
        <div>
          <p class="text-[#1E293B] text-[1.25rem] font-bold">業績サマリー</p>
          <p class="text-[#64748B] text-[1rem]">売上・利益の概況と前期比較</p>
        </div>
      </div>
      <div class="flex items-start gap-4">
        <span class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center text-white font-bold text-[1.125rem] shrink-0">2</span>
        <div>
          <p class="text-[#1E293B] text-[1.25rem] font-bold">チャネル別実績</p>
          <p class="text-[#64748B] text-[1rem]">各チャネルのパフォーマンスと分析</p>
        </div>
      </div>
      <div class="flex items-start gap-4">
        <span class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center text-white font-bold text-[1.125rem] shrink-0">3</span>
        <div>
          <p class="text-[#1E293B] text-[1.25rem] font-bold">課題と次期施策</p>
          <p class="text-[#64748B] text-[1rem]">改善ポイントとアクションプラン</p>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
