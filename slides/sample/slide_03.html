<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, height=720">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
</style>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { sans: ['"Noto Sans JP"', 'sans-serif'] },
      colors: {
        primary: '#1B73E8', 'primary-dark': '#1557B0',
        secondary: '#34A853', accent: '#FF6D2E',
      }
    }
  }
}
</script>
</head>
<body class="font-sans">
<div class="w-[1280px] h-[720px] bg-[#F8FAFC] p-[48px_60px] flex flex-col relative overflow-hidden"
     data-speaker-notes="KPIサマリー。売上は前期比15%増、利益率も改善傾向。新規顧客獲得が好調。">
  <div class="absolute bottom-4 right-8 text-[0.75rem] text-[#94A3B8]">3</div>
  <div class="mb-8">
    <div class="w-10 h-1 bg-primary mb-4 rounded-full"></div>
    <h2 class="text-[1.75rem] font-bold text-[#1E293B]">業績サマリー</h2>
  </div>
  <div class="flex-1 grid grid-cols-3 gap-6">
    <div class="bg-white rounded-xl p-8 shadow-sm border border-[#E2E8F0] flex flex-col justify-center">
      <p class="text-[0.875rem] text-[#64748B] mb-2">売上高</p>
      <p class="text-[2.5rem] font-bold text-primary mb-2">¥12.5M</p>
      <p class="text-[0.875rem] text-secondary font-medium">▲ 15.2% 前期比</p>
    </div>
    <div class="bg-white rounded-xl p-8 shadow-sm border border-[#E2E8F0] flex flex-col justify-center">
      <p class="text-[0.875rem] text-[#64748B] mb-2">営業利益率</p>
      <p class="text-[2.5rem] font-bold text-accent mb-2">18.3%</p>
      <p class="text-[0.875rem] text-secondary font-medium">▲ 2.1pt 改善</p>
    </div>
    <div class="bg-white rounded-xl p-8 shadow-sm border border-[#E2E8F0] flex flex-col justify-center">
      <p class="text-[0.875rem] text-[#64748B] mb-2">新規顧客数</p>
      <p class="text-[2.5rem] font-bold text-secondary mb-2">847社</p>
      <p class="text-[0.875rem] text-secondary font-medium">▲ 23.4% 前期比</p>
    </div>
  </div>
</div>
</body>
</html>
