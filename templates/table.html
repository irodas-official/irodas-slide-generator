<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, height=720">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
</style>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { sans: ['"Noto Sans JP"', 'sans-serif'] },
      colors: {
        primary: '#1B73E8', 'primary-dark': '#1557B0',
        secondary: '#34A853', accent: '#FF6D2E',
      }
    }
  }
}
</script>
</head>
<body class="font-sans">
<!-- スライド: テーブル -->
<div class="w-[1280px] h-[720px] bg-white p-[48px_60px] flex flex-col relative overflow-hidden"
     data-speaker-notes="{{SPEAKER_NOTES}}">
  <div class="absolute bottom-4 right-8 text-[0.75rem] text-[#94A3B8]">{{PAGE_NUMBER}}</div>

  <div class="mb-8">
    <div class="w-10 h-1 bg-primary mb-4 rounded-full"></div>
    <h2 class="text-[1.75rem] font-bold text-[#1E293B]">{{HEADING}}</h2>
  </div>

  <div class="flex-1 flex items-start">
    <table class="w-full border-collapse text-[1rem]">
      <thead>
        <tr class="bg-primary text-white">
          <th class="px-6 py-4 text-left font-bold rounded-tl-lg">{{TH_1}}</th>
          <th class="px-6 py-4 text-left font-bold">{{TH_2}}</th>
          <th class="px-6 py-4 text-left font-bold">{{TH_3}}</th>
          <th class="px-6 py-4 text-left font-bold rounded-tr-lg">{{TH_4}}</th>
        </tr>
      </thead>
      <tbody>
        <tr class="border-b border-[#E2E8F0]">
          <td class="px-6 py-4 font-medium text-[#1E293B]">{{TD_1_1}}</td>
          <td class="px-6 py-4 text-[#334155]">{{TD_1_2}}</td>
          <td class="px-6 py-4 text-[#334155]">{{TD_1_3}}</td>
          <td class="px-6 py-4 text-[#334155]">{{TD_1_4}}</td>
        </tr>
        <tr class="border-b border-[#E2E8F0] bg-[#F8FAFC]">
          <td class="px-6 py-4 font-medium text-[#1E293B]">{{TD_2_1}}</td>
          <td class="px-6 py-4 text-[#334155]">{{TD_2_2}}</td>
          <td class="px-6 py-4 text-[#334155]">{{TD_2_3}}</td>
          <td class="px-6 py-4 text-[#334155]">{{TD_2_4}}</td>
        </tr>
        <tr class="border-b border-[#E2E8F0]">
          <td class="px-6 py-4 font-medium text-[#1E293B]">{{TD_3_1}}</td>
          <td class="px-6 py-4 text-[#334155]">{{TD_3_2}}</td>
          <td class="px-6 py-4 text-[#334155]">{{TD_3_3}}</td>
          <td class="px-6 py-4 text-[#334155]">{{TD_3_4}}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
