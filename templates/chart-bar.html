<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, height=720">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
</style>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { sans: ['"Noto Sans JP"', 'sans-serif'] },
      colors: {
        primary: '#1B73E8', 'primary-dark': '#1557B0',
        secondary: '#34A853', accent: '#FF6D2E',
      }
    }
  }
}
</script>
</head>
<body class="font-sans">
<!-- スライド: 棒グラフ -->
<div class="w-[1280px] h-[720px] bg-white p-[48px_60px] flex flex-col relative overflow-hidden"
     data-speaker-notes="{{SPEAKER_NOTES}}">
  <div class="absolute bottom-4 right-8 text-[0.75rem] text-[#94A3B8]">{{PAGE_NUMBER}}</div>

  <div class="mb-8">
    <div class="w-10 h-1 bg-primary mb-4 rounded-full"></div>
    <h2 class="text-[1.75rem] font-bold text-[#1E293B]">{{HEADING}}</h2>
  </div>

  <!-- グラフエリア -->
  <div class="flex-1 flex items-end gap-6 px-8 pb-8">
    <!-- Y軸ラベル -->
    <div class="flex flex-col justify-between h-full text-[0.75rem] text-[#94A3B8] pr-2">
      <span>{{Y_MAX}}</span>
      <span>{{Y_MID}}</span>
      <span>0</span>
    </div>
    <!-- バー群 -->
    <div class="flex-1 flex items-end justify-around gap-4 border-b border-l border-[#E2E8F0] h-[420px] pl-2 pb-2">
      <!--
        各バーは以下のように生成（高さはpx指定。400pxが最大）:
        <div class="flex flex-col items-center gap-2">
          <span class="text-[0.875rem] font-bold text-[#1E293B]">{{VALUE}}</span>
          <div class="w-16 bg-primary rounded-t-lg" style="height: {{HEIGHT_PX}}px"></div>
          <span class="text-[0.75rem] text-[#64748B]">{{LABEL}}</span>
        </div>
      -->
      <div class="flex flex-col items-center gap-2">
        <span class="text-[0.875rem] font-bold text-[#1E293B]">{{VALUE_1}}</span>
        <div class="w-16 bg-primary rounded-t-lg" style="height: {{HEIGHT_1_PX}}px"></div>
        <span class="text-[0.75rem] text-[#64748B]">{{LABEL_1}}</span>
      </div>
      <div class="flex flex-col items-center gap-2">
        <span class="text-[0.875rem] font-bold text-[#1E293B]">{{VALUE_2}}</span>
        <div class="w-16 bg-secondary rounded-t-lg" style="height: {{HEIGHT_2_PX}}px"></div>
        <span class="text-[0.75rem] text-[#64748B]">{{LABEL_2}}</span>
      </div>
      <div class="flex flex-col items-center gap-2">
        <span class="text-[0.875rem] font-bold text-[#1E293B]">{{VALUE_3}}</span>
        <div class="w-16 bg-accent rounded-t-lg" style="height: {{HEIGHT_3_PX}}px"></div>
        <span class="text-[0.75rem] text-[#64748B]">{{LABEL_3}}</span>
      </div>
      <div class="flex flex-col items-center gap-2">
        <span class="text-[0.875rem] font-bold text-[#1E293B]">{{VALUE_4}}</span>
        <div class="w-16 bg-[#F59E0B] rounded-t-lg" style="height: {{HEIGHT_4_PX}}px"></div>
        <span class="text-[0.75rem] text-[#64748B]">{{LABEL_4}}</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
