<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, height=720">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
</style>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { sans: ['"Noto Sans JP"', 'sans-serif'] },
      colors: {
        primary: '#1B73E8', 'primary-dark': '#1557B0',
        secondary: '#34A853', accent: '#FF6D2E',
      }
    }
  }
}
</script>
</head>
<body class="font-sans">
<!-- スライド: キーメッセージ -->
<div class="w-[1280px] h-[720px] bg-white flex items-center justify-center relative overflow-hidden"
     data-speaker-notes="{{SPEAKER_NOTES}}">
  <div class="absolute bottom-4 right-8 text-[0.75rem] text-[#94A3B8]">{{PAGE_NUMBER}}</div>

  <!-- 背景装飾 -->
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary/5 rounded-full"></div>

  <div class="text-center z-10 px-[120px]">
    <h2 class="text-[2.5rem] font-bold text-[#1E293B] leading-relaxed mb-8">{{KEY_MESSAGE}}</h2>
    <p class="text-[1.25rem] text-[#64748B]">{{SUPPORTING_TEXT}}</p>
  </div>
</div>
</body>
</html>
